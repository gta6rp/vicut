<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root { --ink:#0b0a16; --text:#fff4ec; --text-2:#c9bfd8; --cut:#23f0d6; --grad:linear-gradient(100deg,#ffb347,#ff5e7e 45%,#d63af9); }
body { margin:0; background:#222; font-family:Inter,sans-serif; }
.c { position:relative; overflow:hidden; background:radial-gradient(120% 90% at 75% 110%, rgba(214,58,249,.35), transparent 60%), linear-gradient(180deg,#0b0a16 0%,#1a0f2e 60%,#2a1030 100%); color:var(--text); margin:0 0 20px; }
.sun { position:absolute; border-radius:50%; background:linear-gradient(180deg,#ffb347,#ff5e7e 55%,#d63af9);
  -webkit-mask:repeating-linear-gradient(180deg,#000 0 16px,transparent 16px 23px), linear-gradient(#000 45%,transparent 100%); -webkit-mask-composite:source-in; }
.grid { position:absolute; left:-10%; right:-10%; bottom:0; height:36%; transform:perspective(380px) rotateX(58deg); transform-origin:bottom;
  background:linear-gradient(transparent 0 calc(100% - 1px), rgba(35,240,214,.4) 0) 0 0/100% 40px, linear-gradient(90deg, transparent 0 calc(100% - 1px), rgba(35,240,214,.4) 0) 0 0/60px 100%;
  -webkit-mask:linear-gradient(transparent,#000 60%); }
.wm { font:400 1em/1 Anton,sans-serif; letter-spacing:.02em; }
.wm b { font-weight:400; background:var(--grad); -webkit-background-clip:text; color:transparent; }
.cap { font:400 1em/.92 Anton,sans-serif; text-transform:uppercase; margin:0; }
.grad { background:var(--grad); -webkit-background-clip:text; color:transparent; }
.mono { font-family:'JetBrains Mono',monospace; }
#avatar { width:400px; height:400px; display:grid; place-items:center; }
#avatar img { width:300px; height:300px; border-radius:64px; }
#banner { width:1500px; height:500px; }
#banner .sun { width:440px; height:440px; right:120px; bottom:40px; }
#banner .txt { position:absolute; left:84px; top:62px; }
#banner .cap { font-size:112px; }
#banner .tag { margin-top:22px; font:600 22px 'JetBrains Mono',monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--cut); }
#og { width:1200px; height:630px; }
#og .sun { width:360px; height:360px; right:36px; bottom:96px; opacity:.85; }
#og .top { position:absolute; left:72px; top:64px; display:flex; align-items:center; gap:16px; font-size:52px; }
#og .top img { width:58px; height:58px; }
#og .cap { position:absolute; left:72px; top:190px; font-size:118px; }
#og .sub { position:absolute; left:72px; bottom:72px; font:600 26px Inter,sans-serif; color:var(--text-2); max-width:640px; }
</style></head><body>
<div class="c" id="avatar"><img src="../assets/mark.svg" alt=""></div>
<div class="c" id="banner"><i class="sun"></i><i class="grid"></i>
  <div class="txt"><p class="cap">GTA 6 streams,<br><span class="grad">clipped live.</span></p><p class="tag">vicut.fun · every five-star moment, first</p></div></div>
<div class="c" id="og"><i class="sun"></i><i class="grid"></i>
  <div class="top"><img src="../assets/mark.svg" alt=""><span class="wm"><b>VI</b>CUT</span></div>
  <p class="cap">GTA 6 streams,<br><span class="grad">clipped live.</span></p>
  <p class="sub">An AI cut room watches the biggest GTA 6 streams and cuts the moments chat loses it over, in minutes.</p></div>
</body></html>
